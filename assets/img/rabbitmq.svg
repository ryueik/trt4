<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" class="dg" role="img" aria-label="RabbitMQ: produtor, exchange, bindings, filas e consumidores"><title>RabbitMQ: produtor, exchange, bindings, filas e consumidores</title><defs><marker id="ar-rabbitmq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-box" x="10" y="135" width="120" height="56" rx="10"/><text class="dg-t" x="70.0" y="167.0" text-anchor="middle" font-size="13">Produtor</text><path class="dg-line" d="M130,163 L215,163" marker-end="url(#ar-rabbitmq)"/><text class="dg-s" x="172" y="152" text-anchor="middle">routing key</text><rect class="dg-warn" x="220" y="120" width="150" height="86" rx="10"/><text class="dg-t" x="295.0" y="151.0" text-anchor="middle" font-size="13">Exchange</text><text class="dg-s" x="295.0" y="167.0" text-anchor="middle" font-size="11.5">direct · topic</text><text class="dg-s" x="295.0" y="183.0" text-anchor="middle" font-size="11.5">fanout · headers</text><path class="dg-line" d="M370,163 L470,68" marker-end="url(#ar-rabbitmq)"/><rect class="dg-acc" x="475" y="40" width="180" height="56" rx="10"/><text class="dg-t" x="565.0" y="64.0" text-anchor="middle" font-size="12">fila: processos.novos</text><text class="dg-s" x="565.0" y="80.0" text-anchor="middle" font-size="11.5">binding: processo.novo</text><path class="dg-line" d="M655,68 L695,68" marker-end="url(#ar-rabbitmq)"/><rect class="dg-box" x="700" y="46" width="110" height="44" rx="10"/><text class="dg-t" x="755.0" y="72.0" text-anchor="middle" font-size="12">Consumidor</text><path class="dg-line" d="M370,163 L470,163" marker-end="url(#ar-rabbitmq)"/><rect class="dg-acc" x="475" y="135" width="180" height="56" rx="10"/><text class="dg-t" x="565.0" y="159.0" text-anchor="middle" font-size="12">fila: auditoria</text><text class="dg-s" x="565.0" y="175.0" text-anchor="middle" font-size="11.5">binding: #</text><path class="dg-line" d="M655,163 L695,163" marker-end="url(#ar-rabbitmq)"/><rect class="dg-box" x="700" y="141" width="110" height="44" rx="10"/><text class="dg-t" x="755.0" y="167.0" text-anchor="middle" font-size="12">Consumidor</text><path class="dg-line" d="M370,163 L470,258" marker-end="url(#ar-rabbitmq)"/><rect class="dg-acc" x="475" y="230" width="180" height="56" rx="10"/><text class="dg-t" x="565.0" y="254.0" text-anchor="middle" font-size="12">fila: notificacoes</text><text class="dg-s" x="565.0" y="270.0" text-anchor="middle" font-size="11.5">binding: *.erro</text><path class="dg-line" d="M655,258 L695,258" marker-end="url(#ar-rabbitmq)"/><rect class="dg-box" x="700" y="236" width="110" height="44" rx="10"/><text class="dg-t" x="755.0" y="262.0" text-anchor="middle" font-size="12">Consumidor</text><text class="dg-s" x="410" y="320" text-anchor="middle">O produtor publica na exchange; as bindings decidem em que filas a mensagem entra; consumidores confirmam (ack).</text></svg>
