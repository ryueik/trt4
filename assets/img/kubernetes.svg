<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" class="dg" role="img" aria-label="Arquitetura do Kubernetes"><title>Arquitetura do Kubernetes</title><defs><marker id="ar-kubernetes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-zone" x="10" y="10" width="300" height="360" rx="14"/><text class="dg-t" x="160" y="34" text-anchor="middle">Control plane</text><rect class="dg-pri" x="30" y="50" width="260" height="64" rx="10"/><text class="dg-t" x="160.0" y="78.0" text-anchor="middle" font-size="13">kube-apiserver</text><text class="dg-s" x="160.0" y="94.0" text-anchor="middle" font-size="11.5">porta de entrada (kubectl)</text><rect class="dg-pri" x="30" y="128" width="260" height="64" rx="10"/><text class="dg-t" x="160.0" y="156.0" text-anchor="middle" font-size="13">etcd</text><text class="dg-s" x="160.0" y="172.0" text-anchor="middle" font-size="11.5">estado do cluster (chave-valor)</text><rect class="dg-pri" x="30" y="206" width="260" height="64" rx="10"/><text class="dg-t" x="160.0" y="234.0" text-anchor="middle" font-size="13">kube-scheduler</text><text class="dg-s" x="160.0" y="250.0" text-anchor="middle" font-size="11.5">escolhe o nó de cada Pod</text><rect class="dg-pri" x="30" y="284" width="260" height="64" rx="10"/><text class="dg-t" x="160.0" y="312.0" text-anchor="middle" font-size="13">controller-manager</text><text class="dg-s" x="160.0" y="328.0" text-anchor="middle" font-size="11.5">mantém o estado desejado</text><rect class="dg-zone" x="350" y="10" width="520" height="360" rx="14"/><text class="dg-t" x="610" y="34" text-anchor="middle">Worker nodes</text><rect class="dg-box" x="370" y="50" width="230" height="300" rx="10"/><text class="dg-t" x="485" y="72" text-anchor="middle">Nó 1</text><rect class="dg-warn" x="385" y="84" width="200" height="38" rx="10"/><text class="dg-t" x="485.0" y="107.0" text-anchor="middle" font-size="12">kubelet · kube-proxy</text><rect class="dg-box" x="385" y="130" width="200" height="30" rx="10"/><text class="dg-t" x="485.0" y="149.0" text-anchor="middle" font-size="12">container runtime</text><rect class="dg-acc" x="385" y="175" width="95" height="70" rx="10"/><text class="dg-t" x="432.5" y="206.0" text-anchor="middle" font-size="13">Pod</text><text class="dg-s" x="432.5" y="222.0" text-anchor="middle" font-size="11.5">contêiner(es)</text><rect class="dg-acc" x="490" y="175" width="95" height="70" rx="10"/><text class="dg-t" x="537.5" y="206.0" text-anchor="middle" font-size="13">Pod</text><text class="dg-s" x="537.5" y="222.0" text-anchor="middle" font-size="11.5">contêiner(es)</text><rect class="dg-box" x="385" y="260" width="200" height="76" rx="10"/><text class="dg-t" x="485.0" y="294.0" text-anchor="middle" font-size="12">Deployment → ReplicaSet</text><text class="dg-s" x="485.0" y="310.0" text-anchor="middle" font-size="11.5">réplicas, rolling update</text><rect class="dg-box" x="620" y="50" width="230" height="300" rx="10"/><text class="dg-t" x="735" y="72" text-anchor="middle">Nó 2</text><rect class="dg-warn" x="635" y="84" width="200" height="38" rx="10"/><text class="dg-t" x="735.0" y="107.0" text-anchor="middle" font-size="12">kubelet · kube-proxy</text><rect class="dg-box" x="635" y="130" width="200" height="30" rx="10"/><text class="dg-t" x="735.0" y="149.0" text-anchor="middle" font-size="12">container runtime</text><rect class="dg-acc" x="635" y="175" width="95" height="70" rx="10"/><text class="dg-t" x="682.5" y="206.0" text-anchor="middle" font-size="13">Pod</text><text class="dg-s" x="682.5" y="222.0" text-anchor="middle" font-size="11.5">contêiner(es)</text><rect class="dg-acc" x="740" y="175" width="95" height="70" rx="10"/><text class="dg-t" x="787.5" y="206.0" text-anchor="middle" font-size="13">Pod</text><text class="dg-s" x="787.5" y="222.0" text-anchor="middle" font-size="11.5">contêiner(es)</text><rect class="dg-box" x="635" y="260" width="200" height="76" rx="10"/><text class="dg-t" x="735.0" y="294.0" text-anchor="middle" font-size="12">Deployment → ReplicaSet</text><text class="dg-s" x="735.0" y="310.0" text-anchor="middle" font-size="11.5">réplicas, rolling update</text><path class="dg-line" d="M290,82 L370,103" marker-end="url(#ar-kubernetes)"/><rect class="dg-pri" x="350" y="380" width="520" height="34" rx="10"/><text class="dg-t" x="610.0" y="401.0" text-anchor="middle" font-size="12">Ingress (HTTP) → Service (ClusterIP/NodePort/LoadBalancer) → Pods</text></svg>
