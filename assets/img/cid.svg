<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" class="dg" role="img" aria-label="Tríade CID"><title>Tríade CID</title><defs><marker id="ar-cid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><path class="dg-pri" d="M350,50 L570,330 L130,330 Z"/><circle class="dg-acc" cx="350" cy="50" r="40"/><text class="dg-t" x="350" y="57" text-anchor="middle" font-size="22">C</text><circle class="dg-acc" cx="130" cy="330" r="40"/><text class="dg-t" x="130" y="337" text-anchor="middle" font-size="22">I</text><circle class="dg-acc" cx="570" cy="330" r="40"/><text class="dg-t" x="570" y="337" text-anchor="middle" font-size="22">D</text><text class="dg-t" x="350" y="150" text-anchor="middle">Confidencialidade</text><text class="dg-s" x="350" y="166" text-anchor="middle">só quem é autorizado acessa</text><text class="dg-s" x="20" y="394" text-anchor="start">Integridade: sem alteração indevida</text><text class="dg-s" x="680" y="394" text-anchor="end">Disponibilidade: acesso quando necessário</text><text class="dg-t" x="350" y="240" text-anchor="middle">Complementares</text><text class="dg-s" x="350" y="260" text-anchor="middle">autenticidade · não repúdio</text><text class="dg-s" x="350" y="278" text-anchor="middle">responsabilização · privacidade</text></svg>
