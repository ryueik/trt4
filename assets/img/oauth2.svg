<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" class="dg" role="img" aria-label="OAuth 2.0 Authorization Code com PKCE"><title>OAuth 2.0 Authorization Code com PKCE</title><defs><marker id="ar-oauth2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-pri" x="5" y="10" width="170" height="48" rx="10"/><text class="dg-t" x="90.0" y="30.0" text-anchor="middle" font-size="12">Usuário</text><text class="dg-t" x="90.0" y="46.0" text-anchor="middle" font-size="12">(navegador)</text><path class="dg-lane" d="M90,58 L90,455"/><rect class="dg-pri" x="215" y="10" width="170" height="48" rx="10"/><text class="dg-t" x="300.0" y="30.0" text-anchor="middle" font-size="12">Cliente</text><text class="dg-t" x="300.0" y="46.0" text-anchor="middle" font-size="12">(aplicação)</text><path class="dg-lane" d="M300,58 L300,455"/><rect class="dg-pri" x="435" y="10" width="170" height="48" rx="10"/><text class="dg-t" x="520.0" y="30.0" text-anchor="middle" font-size="12">Servidor de autorização</text><text class="dg-t" x="520.0" y="46.0" text-anchor="middle" font-size="12">(Keycloak)</text><path class="dg-lane" d="M520,58 L520,455"/><rect class="dg-pri" x="645" y="10" width="170" height="48" rx="10"/><text class="dg-t" x="730.0" y="30.0" text-anchor="middle" font-size="12">Resource Server</text><text class="dg-t" x="730.0" y="46.0" text-anchor="middle" font-size="12">(API)</text><path class="dg-lane" d="M730,58 L730,455"/><path class="dg-line" d="M90,95 L294,95" marker-end="url(#ar-oauth2)"/><text class="dg-s" x="195.0" y="88" text-anchor="middle">1. acessa a aplicação</text><path class="dg-line" d="M300,140 L514,140" marker-end="url(#ar-oauth2)"/><text class="dg-s" x="410.0" y="133" text-anchor="middle">2. redireciona: /authorize + code_challenge (PKCE)</text><path class="dg-line" d="M90,185 L514,185" marker-end="url(#ar-oauth2)"/><text class="dg-s" x="305.0" y="178" text-anchor="middle">3. login + MFA e consentimento</text><path class="dg-line" d="M520,230 L306,230" marker-end="url(#ar-oauth2)"/><text class="dg-s" x="410.0" y="223" text-anchor="middle">4. redirect_uri?code=…</text><path class="dg-line" d="M300,275 L514,275" marker-end="url(#ar-oauth2)"/><text class="dg-s" x="410.0" y="268" text-anchor="middle">5. POST /token: code + code_verifier</text><path class="dg-line" d="M520,320 L306,320" marker-end="url(#ar-oauth2)"/><text class="dg-s" x="410.0" y="313" text-anchor="middle">6. access token + refresh token + ID token (OIDC)</text><path class="dg-line" d="M300,365 L724,365" marker-end="url(#ar-oauth2)"/><text class="dg-s" x="515.0" y="358" text-anchor="middle">7. GET /api  Authorization: Bearer &lt;token&gt;</text><path class="dg-line" d="M730,410 L306,410" marker-end="url(#ar-oauth2)"/><text class="dg-s" x="515.0" y="403" text-anchor="middle">8. valida assinatura/escopos e responde</text></svg>
