-t" x="655.0" y="172.0" text-anchor="middle" font-size="13">interno</text><path class="dg-line" d="M705,160 L745,160" marker-end="url(#ar-dmz)"/><rect class="dg-zone" x="750" y="20" width="140" height="280" rx="14"/><text class="dg-t" x="820" y="44" text-anchor="middle">Rede interna</text><rect class="dg-pri" x="765" y="60" width="110" height="62" rx="10"/><text class="dg-t" x="820.0" y="87.0" text-anchor="middle" font-size="12">Banco de</text><text class="dg-t" x="820.0" y="103.0" text-anchor="middle" font-size="12">dados</text><rect class="dg-pri" x="765" y="136" width="110" height="62" rx="10"/><text class="dg-t" x="820.0" y="163.0" text-anchor="middle" font-size="12">Servidores de</text><text class="dg-t" x="820.0" y="179.0" text-anchor="middle" font-size="12">aplicação</text><rect class="dg-pri" x="765" y="212" width="110" height="62" rx="10"/><text class="dg-t" x="820.0" y="247.0" text-anchor="middle" font-size="12">Estações</text><text class="dg-s" x="450" y="322" text-anchor="middle">Internet → só a DMZ · DMZ não abre conexões livres para a rede interna · negar tudo por padrão</text></svg>
